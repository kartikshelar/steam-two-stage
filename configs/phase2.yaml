seed: 42

labels:
  hours_threshold: 2.0
  game_percentile: 50

leak:
  max_train_positives: 250000
  max_test_positives: 40000
  n_neg_train: 4
  n_neg_test: 10

gbdt:
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 50
  random_state: 42
  verbosity: -1
